name: sync-news
on:
  schedule: [{ cron: "5 3,15 * * *" }]   # два раза в сутки: 08:05 и 20:05 по Астане (UTC+5), по просьбе техотдела вуза
  workflow_dispatch: {}
permissions: { contents: write }   # только запись коммитов в этот репозиторий
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: parser/requirements.txt }
      - run: pip install -r parser/requirements.txt
      - id: news
        run: python parser/news.py
      - uses: actions/setup-node@v4
        if: steps.news.outputs.new == 'true'
        with: { node-version: 20 }
      - name: Загрузить новые записи в D1 и сохранить состояние
        if: steps.news.outputs.new == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/PUT_YOUR_D1_ID_HERE/$D1_DATABASE_ID/" worker/wrangler.toml
          cd worker && npm ci --no-audit --no-fund
          npx wrangler d1 execute msu-schedule --remote --file ../out/news.sql
          cd ..
          git checkout -- worker/wrangler.toml
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news_seen.json
          git commit -m "news: seen"
          git pull --rebase
          git push

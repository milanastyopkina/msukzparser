name: sync-schedule
on:
  schedule: [{ cron: "50 14 * * *" }]   # раз в день в 19:50 по Астане (UTC+5): к 20:00 расписание уже в базе; GitHub может задержать запуск на 5–30 минут
  workflow_dispatch: {}
  push: { paths: ["manual/*.json", "manual/*.doc", "manual/*.docx"] }    # положили файл в manual/ — сразу пересчитать
permissions: { contents: write }   # только запись коммитов в этот репозиторий
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: parser/requirements.txt }
      - name: Установить LibreOffice (с повтором при зависании зеркала)
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer' && break
            echo "попытка $i не удалась, повтор"; sleep 5
          done
          which soffice libreoffice || { echo "LibreOffice не установлен"; exit 1; }
      - run: pip install -r parser/requirements.txt
      - id: sync
        run: python parser/sync.py
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Загрузить в D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        working-directory: worker
        run: |
          sed -i "s/PUT_YOUR_D1_ID_HERE/$D1_DATABASE_ID/" wrangler.toml
          npm ci --no-audit --no-fund
          NEW=$(cat ../out/load.sha256); OLD=$(cat ../data/load.sha256 2>/dev/null || true)
          CHANGED=0
          if [ "$NEW" != "$OLD" ]; then
            npx wrangler d1 execute msu-schedule --remote --file ../out/load.sql
            cp ../out/load.sha256 ../data/load.sha256
            CHANGED=1
          fi
          npx wrangler d1 execute msu-schedule --remote --file ../out/checked.sql
          if [ "$CHANGED" = "1" ]; then
            cd ..
            git checkout -- worker/wrangler.toml
            git config user.name "schedule-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/load.sha256
            git commit -m "d1: loaded"
            git pull --rebase
            git push
          fi

name: sync-schedule
on:
  schedule: [{ cron: "7 1,4,7,10,13,16,18 * * *" }]   # 06:07 … 23:07 по Астане (UTC+5)
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: parser/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer
      - run: pip install -r parser/requirements.txt
      - id: sync
        run: python parser/sync.py
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Загрузить в D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        working-directory: worker
        run: |
          sed -i "s/PUT_YOUR_D1_ID_HERE/$D1_DATABASE_ID/" wrangler.toml
          npm ci --no-audit --no-fund
          NEW=$(cat ../out/load.sha256); OLD=$(cat ../data/load.sha256 2>/dev/null || true)
          if [ "$NEW" != "$OLD" ]; then
            npx wrangler d1 execute msu-schedule --remote --file ../out/load.sql
            cp ../out/load.sha256 ../data/load.sha256
            cd .. && git config user.name "schedule-bot" && git config user.email "bot@users.noreply.github.com" && git add data/load.sha256 && git commit -m "d1: loaded" && git push; cd worker
          fi
          npx wrangler d1 execute msu-schedule --remote --file ../out/checked.sql
